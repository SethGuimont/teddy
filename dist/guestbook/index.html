
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Leave a message for Teddy." />
        <title>Guestbook | Forever With Us</title>
        

        <link rel="stylesheet" href="/assets/style.css" />
        <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    </head>
    <body>
        <header class="site-header">

        </header>
        <main>
<h1>Guestbook for Teddy</h1>
<div>
    <h2>Leave a Message</h2>
    <p>Submissions are reviewed and added to the page below periodically &mdash; they won't appear instantly.</p>
    <form name="guestbook" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thanks/">
        <input type="hidden" name="form-name" value="guestbook" />
        <p style="display:none">
            <label>Don't fill this out if you're human: <input name="bot-field" /></label>
        </p>
        <div>
            <label for="name">Your name</label><br />
            <input type="text" id="name" name="name" maxlength="100" />
        </div>
        <div>
            <label for="message">Message</label><br />
            <textarea id="message" name="message" rows="4" maxlength="2000" required></textarea>
        </div>
        <button type="submit">Sign the Guestbook</button>
    </form>
</div>
<div>
    <h2>Messages</h2>
    
    <p>No messages yet. Be the first to leave one.</p>
    
</div>

</main>
<footer class="site-footer">


  <div class="container center">&copy; 2026 Kayla and Seth.</div>
</footer>
<script src="/assets/nav.js"></script>
<script src="/assets/car.js"></script>
</body>
</html>
