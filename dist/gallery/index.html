
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Photos of Teddy." />
        <title>Gallery | Forever With Us</title>
        

        <link rel="stylesheet" href="/assets/style.css" />
        <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    </head>
    <body>
        <header class="site-header">
            <h1>A Memorial to Our Precious Teddy</h1>
            <nav>
                <a href="/">Home</a> |
                <a href="/gallery/">Photos</a> |
                <a href="/guestbook/">Guestbook</a>
            </nav>
        </header>
        <main>

<h1>Photos of Teddy</h1>

<div>
    
    <div id="slideshow">
        <button type="button" id="prev-btn" aria-label="Previous photo">&larr;</button>
        <span id="slide-track">
            
            <figure class="slide" data-index="0" >
                <img src="/assets/images/1.JPG" alt="Photo of Teddy" style="max-width:100%;max-height:70vh;" />
                
            </figure>
            
            <figure class="slide" data-index="1" style="display:none;">
                <img src="/assets/images/2.JPEG" alt="Photo of Teddy" style="max-width:100%;max-height:70vh;" />
                
            </figure>
            
            <figure class="slide" data-index="2" style="display:none;">
                <img src="/assets/images/3.JPG" alt="Photo of Teddy" style="max-width:100%;max-height:70vh;" />
                
            </figure>
            
            <figure class="slide" data-index="3" style="display:none;">
                <img src="/assets/images/4.JPG" alt="Photo of Teddy" style="max-width:100%;max-height:70vh;" />
                
            </figure>
            
            <figure class="slide" data-index="4" style="display:none;">
                <img src="/assets/images/5.JPEG" alt="Photo of Teddy" style="max-width:100%;max-height:70vh;" />
                
            </figure>
            
        </span>
        <button type="button" id="next-btn" aria-label="Next photo">&rarr;</button>
    </div>
    <p id="slide-counter"></p>
    
</div>

<script>
    (function () {
        var slides = document.querySelectorAll(".slide");
        if (!slides.length) return;

        var current = 0;
        var counter = document.getElementById("slide-counter");

        function show(index) {
            slides[current].style.display = "none";
            current = (index + slides.length) % slides.length;
            slides[current].style.display = "";
            if (counter) {
                counter.textContent = (current + 1) + " / " + slides.length;
            }
        }

        document.getElementById("prev-btn").addEventListener("click", function () {
            show(current - 1);
        });
        document.getElementById("next-btn").addEventListener("click", function () {
            show(current + 1);
        });
        document.addEventListener("keydown", function (e) {
            if (e.key === "ArrowLeft") show(current - 1);
            if (e.key === "ArrowRight") show(current + 1);
        });

        show(0);
    })();
</script>


</main>

</footer>

</body>
</html>
